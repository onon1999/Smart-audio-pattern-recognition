version: "3.9"

services:
  api:
    build: .
    container_name: echopulse-api
    command: uvicorn audio_pulse.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./patterns_storage:/app/patterns_storage
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  web:
    build: .
    container_name: echopulse-web
    command: streamlit run apps/web_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./patterns_storage:/app/patterns_storage
      - ./samples:/app/samples
    depends_on:
      - api
    restart: unless-stopped
