[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echopulse-audio"
version = "1.0.0"
description = "Immediate Audio Pattern Recognition & Spectral Analysis Engine"
authors = [{ name = "AI Audio Developer" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "requests>=2.28.0"
]

[project.scripts]
echopulse = "apps.terminal_ui:main"

